[package]
name = "hear-one-device"
version = "0.4.0"
description = "PC 소리를 블루투스(BLE)로 안드로이드 폰에 보내는 앱"
authors = ["naya1228"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hear_one_device_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "signal"] }
futures-util = "0.3"
opus = "0.4"
gethostname = "1.1.0"
# 연결 확인 (auth/)
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
bluer = { version = "0.17", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.17.3"
# tauri가 쓰는 것과 같은 버전 (중복 빌드 방지)
windows = { version = "0.61", features = [
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation_Collections",
    "Storage_Streams",
] }
# 기본 기능(std)을 켜야 WinRT 비동기 작업을 .await 할 수 있음
windows-future = "0.2"

[dev-dependencies]
# 테스트에서 시간을 멈추고 건너뛰기 (5초 기다림 확인)
tokio = { version = "1", features = ["test-util"] }
